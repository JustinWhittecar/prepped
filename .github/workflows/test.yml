name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luajit
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit

      - name: Run the tests
        env:
          # Prepped's own snapshot of SimGear's data (PreppedBackup_<Class>), so CI needs no
          # CurseForge download key. SimGear's newer releases are caught by simgear-watch.yml and
          # by running the tests locally against the installed addon.
          PREPPED_TEST_DATA: backup
        run: ./run_tests.sh
