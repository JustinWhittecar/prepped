name: Release

# Push a tag (v0.1.0-beta, v0.1.0...) to build one zip with the BigWigs packager and upload it to
# CurseForge (and Wago, once the .toc names a Wago project). A tag containing "alpha" or "beta" uploads as that release type.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the packager also attaches the zip to a GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager reads tags and history

      # The packager skips an upload quietly when a project ID or token is missing. Fail here instead,
      # so a release that reaches neither site can't look like a success.
      - name: Check upload setup
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          fail=0
          [ -n "$CF_API_KEY" ] || { echo "::error::Secret CF_API_KEY is not set (CurseForge upload token)"; fail=1; }
          grep -Eq '^## X-Curse-Project-ID: *[0-9]+ *$' Prepped/Prepped.toc && ! grep -q '^## X-Curse-Project-ID: *0* *$' Prepped/Prepped.toc \
            || { echo "::error::Prepped/Prepped.toc has no real '## X-Curse-Project-ID:' line (see the TODO there)"; fail=1; }
          # Wago is optional (CurseForge only for now): with an X-Wago-ID line, its token must be set too.
          if grep -Eq '^## X-Wago-ID:' Prepped/Prepped.toc; then
            [ -n "$WAGO_API_TOKEN" ] || { echo "::error::Prepped.toc names a Wago project but secret WAGO_API_TOKEN is not set"; fail=1; }
          fi
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section for tag $GITHUB_REF_NAME"; fail=1; }
          exit $fail

      - name: Install luajit
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit

      - name: Run the tests
        env:
          # Prepped's own snapshot of SimGear's data (PreppedBackup_<Class>), so CI needs no
          # CurseForge download key. SimGear's newer releases are caught by simgear-watch.yml and
          # by running the tests locally against the installed addon.
          PREPPED_TEST_DATA: backup
        run: ./run_tests.sh

      # Game versions come from the .toc's "## Interface:" line: 16001 -> Forever 1.60.1 on both sites.
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
